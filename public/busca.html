<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buscar Produtos - TechVault</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-light: #4285f4;
      --primary-dark: #1557b0;
      --primary-gradient: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
      --secondary: #1e293b;
      --text: #1e293b;
      --text-light: #64748b;
      --text-muted: #94a3b8;
      --bg-light: #f8fafc;
      --bg-cool: #f1f5f9;
      --white: #ffffff;
      --success: #10b981;
      --border: #e2e8f0;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-light);
      color: var(--text);
    }

    .logo {
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: opacity 0.2s;
    }

    .logo:hover {
      opacity: 0.8;
    }

    .logo img {
      height: 52px;
      width: auto;
      object-fit: contain;
    }

    /* Main Content */
    .main-content {
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    /* Filters Sidebar */
    .filters-sidebar {
      background: var(--white);
      border-radius: 16px;
      padding: 28px;
      height: fit-content;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 100px;
    }

    .filter-section {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-light);
    }

    .filter-section:last-child {
      border-bottom: none;
    }

    .filter-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-title i {
      color: var(--primary);
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .filter-option:hover {
      background: var(--bg-cool);
    }

    .filter-option input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
      margin: 0;
    }

    .filter-option label {
      font-size: 14px;
      color: var(--text-light);
      cursor: pointer;
      font-weight: 500;
      line-height: 1.4;
      flex: 1;
      margin: 0;
      padding: 0;
    }

    .price-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .price-inputs input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }

    .price-inputs input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    }

    .price-inputs span {
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--primary-gradient);
      color: var(--white);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.3);
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26, 115, 232, 0.4);
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    /* Results Area */
    .results-area {
      background: var(--white);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      min-height: 400px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .results-count {
      font-size: 15px;
      color: var(--text-light);
      font-weight: 500;
    }

    .results-count strong {
      color: var(--primary);
      font-weight: 700;
    }

    .sort-select {
      padding: 10px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      background: var(--white);
      color: var(--text);
      transition: all 0.3s;
    }

    .sort-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
      border-color: transparent;
    }

    .product-image {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .product-card:hover .product-image img {
      transform: scale(1.08);
    }

    .product-info {
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }

    .product-rating {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .product-rating i {
      color: #fbbf24;
      font-size: 12px;
    }

    .product-rating span {
      font-weight: 600;
      color: var(--text);
    }

    .rating-count {
      font-weight: 400 !important;
      color: var(--text-muted) !important;
    }

    .product-price {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .product-shipping {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .old-shipping-card {
      text-decoration: line-through;
      color: var(--text-muted);
      font-size: 12px;
    }

    .free-shipping-badge-card {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      color: #16a34a;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    }

    .product-name {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
    }

    .product-seller {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-light);
      font-weight: 500;
    }

    .product-rating i {
      color: #fbbf24;
      font-size: 14px;
    }

    .no-results {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
    }

    .no-results i {
      font-size: 80px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 40px 0;
    }

    .page-btn {
      min-width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text-light);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(26,115,232,0.05);
    }

    .page-btn.active {
      background: var(--primary-gradient);
      color: var(--white);
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(26,115,232,0.3);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-dots {
      padding: 0 4px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .no-results h3 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .no-results p {
      font-size: 15px;
      margin-bottom: 24px;
    }

    .no-results .btn {
      display: inline-flex;
      background: var(--primary-gradient);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .no-results .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* Cart Modal */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2000;
      justify-content: flex-end;
    }

    .cart-modal.active {
      display: flex;
    }

    .cart-modal-content {
      background: var(--white);
      width: 100%;
      max-width: 450px;
      height: 100%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xl);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }

    .cart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--border-light);
      margin-bottom: 24px;
    }

    .cart-modal-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-modal-header h2 i {
      color: var(--primary);
    }

    .close-cart {
      background: var(--bg-cool);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-light);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-cart:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 700;
      padding: 24px 0;
      border-top: 2px solid var(--border);
      margin-top: 16px;
      color: var(--text);
    }

    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: var(--white);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-block {
      width: 100%;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
    }

    .loading i {
      font-size: 48px;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Mobile responsive */
    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .filters-sidebar {
        display: none;
      }

      .filter-fab {
        display: flex;
      }
    }

    /* Mobile filter drawer */
    .filter-fab {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.4);
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .filter-fab:active {
      transform: scale(0.95);
    }

    .filter-drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: var(--white);
      z-index: 5000;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: left 0.3s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-xl);
      overflow-y: auto;
    }
    .filter-drawer.active {
      left: 0;
    }
    .filter-drawer .filter-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .filter-drawer .filter-drawer-header h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .filter-drawer .filter-drawer-header button {
      background: var(--bg-cool);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .filter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(30,41,59,.6);
      backdrop-filter: blur(4px);
      z-index: 4999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .filter-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden !important;
        max-width: 100vw !important;
      }

      .header-top {
        flex-wrap: wrap;
        gap: 16px;
        padding: 14px 16px;
      }

      .search-box {
        order: 3;
        flex-basis: 100%;
      }

      .results-area {
        padding: 20px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .product-image { height: 150px; padding: 16px; }
      .product-info { padding: 10px; gap: 4px; }
      .product-price { font-size: 18px; }
      .product-name { font-size: 11px; min-height: 28px; }
      .product-installments { font-size: 11px; }

      .main-content {
        margin: 20px auto;
        padding: 0 16px;
      }
    }

    @media(max-width:768px){
      .header-top{flex-wrap:wrap;gap:0;padding:10px 12px;justify-content:space-between}

<style>
/* ===== TEMA NATALINO - TechVault ===== */
:root {
  --xmas-red: #d62828;
  --xmas-green: #1a5f2a;
  --xmas-gold: #f59e0b;
  --xmas-snow: #f8fafc;
}

body {
  background: radial-gradient(1200px 600px at 50% -10%, rgba(214, 40, 40, 0.06), transparent 60%),
              linear-gradient(180deg, #fff7f7 0%, #ffffff 40%);
  position: relative;
  overflow-x: hidden;
}

/* Flocos de neve */
.xmas-snow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}

.xmas-snowflake {
  position: absolute;
  top: -10px;
  color: #cbd5e1;
  font-size: 14px;
  text-shadow: 0 0 4px rgba(255,255,255,0.8);
  animation-name: xmas-fall, xmas-sway;
  animation-timing-function: linear, ease-in-out;
  animation-iteration-count: infinite, infinite;
  animation-play-state: running, running;
  opacity: 0.9;
}

@keyframes xmas-fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

@keyframes xmas-sway {
  0%, 100% { margin-left: 0px; }
  50% { margin-left: 40px; }
}

/* Guirlanda no topo */
.xmas-garland {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  pointer-events: none;
  z-index: 10000;

/* Header com toque natalino */
.header-new {
  box-shadow: 0 4px 20px rgba(214, 40, 40, 0.12), 0 1px 0 rgba(245, 158, 11, 0.3);
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, #d62828, #f59e0b, #22c55e, #d62828) 1;
}

/* Botões com gradiente natalino */
.login-link:hover,
.register-link:hover {
  background: linear-gradient(135deg, #d62828 0%, #b91c1c 100%) !important;
}

/* Seções com leve toque */
.section-title {
  position: relative;
}

.section-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, #d62828, #f59e0b);
  border-radius: 2px;
}

/* Footer natalino */
.footer {
  border-top: 3px solid transparent !important;
  border-image: linear-gradient(90deg, #d62828, #f59e0b, #22c55e) 1 !important;
}

/* Mobile ajustes */
@media (max-width: 768px) {
  .xmas-garland {
    height: 50px;
    background-size: 22px 22px;
  }
  .xmas-lights {
    height: 3px;
  }
}

</style>
</style>
</head>
<body>
  <!-- Header -->
    <!--HEADER-->

  <!-- Main Content -->
  <div class="main-content">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar">
      <div class="filter-section">
        <div class="filter-title">
          <i class="fas fa-tags"></i>
          Categorias
        </div>
        <div id="categoriesFilter"></div>
      </div>

      <div class="filter-section">
        <div class="filter-title">
          <i class="fas fa-dollar-sign"></i>
          Preço
        </div>
        <button class="btn btn-outline btn-block" onclick="openPriceFilterModal()" style="width: 100%; justify-content: center;">
          <i class="fas fa-sliders-h"></i> Filtrar por Preço
        </button>
      </div>

      <div class="filter-section">
        <div class="filter-title">
          <i class="fas fa-truck"></i>
          Condição
        </div>
        <label class="filter-option">
          <input type="checkbox" id="freteGratis" onchange="selectCategory(currentFilters.categoria)">
          <label>Frete Grátis</label>
        </label>
      </div>
    </aside>

    <!-- Results Area -->
    <main class="results-area">
      <div class="results-header">
        <div class="results-count" id="resultsCount">
          <!-- Contador de resultados -->
        </div>
        <select class="sort-select" id="sortSelect" onchange="sortProducts()">
          <option value="relevancia">Relevância</option>
          <option value="menor-preco">Menor Preço</option>
          <option value="maior-preco">Maior Preço</option>
          <option value="mais-vendidos">Mais Vendidos</option>
          <option value="novidades">Novidades</option>
        </select>
      </div>
      
      <div class="products-grid" id="productsGrid">
        <div class="loading">
          <i class="fas fa-spinner"></i>
          <p style="margin-top: 16px; color: var(--text-light);">Carregando produtos...</p>
        </div>
      </div>

      <div id="pagination"></div>

      <div id="noResults" class="no-results" style="display: none;">
        <i class="fas fa-search"></i>
        <h3>Nenhum produto encontrado</h3>
        <p>Tente ajustar seus filtros ou buscar por outro termo</p>
        <a href="/" class="btn">
          <i class="fas fa-home"></i>
          Voltar para a loja
        </a>
      </div>
    </main>
  </div>

  <!-- Mobile Filter FAB -->
  <button class="filter-fab" id="filterFab" onclick="toggleMobileFilters()">
    <i class="fas fa-sliders-h"></i> Filtrar
  </button>

  <!-- Mobile Filter Drawer -->
  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-drawer-header">
      <h3><i class="fas fa-sliders-h"></i> Filtros</h3>
      <button onclick="toggleMobileFilters()"><i class="fas fa-times"></i></button>
    </div>
    <div id="mobileCategoriesFilter"></div>
    <div class="filter-section" style="padding:0;">
      <div class="filter-title" style="padding:16px 0;border-top:1px solid var(--border);">
        <i class="fas fa-truck"></i> Condição
      </div>
      <label class="filter-option">
        <input type="checkbox" id="mobileFreteGratis" onchange="mobileFreteChange()">
        <label for="mobileFreteGratis">Frete Grátis</label>
      </label>
    </div>
  </div>
  <div class="filter-overlay" id="filterOverlay" onclick="toggleMobileFilters()"></div>

  <!-- Price Filter Modal -->
  <div id="priceFilterModal" class="cart-modal" style="display: none;">
    <div class="cart-modal-content" style="max-width: 500px;">
      <div class="cart-modal-header">
        <h2><i class="fas fa-dollar-sign"></i> Filtrar por Preço</h2>
        <button class="close-cart" onclick="closePriceFilterModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="cart-items" style="padding: 20px 0;">
        <div style="margin-bottom: 24px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text);">
            <i class="fas fa-crosshairs"></i> Valor de Referência
          </label>
          <input type="number" id="referencePrice" placeholder="R$ 0,00" min="0" 
            style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px;" 
            oninput="this.value = this.value.replace(/[^0-9.]/g, '')">
          <p style="font-size: 13px; color: var(--text-light); margin-top: 8px;">
            Encontre produtos próximos a este valor
          </p>
        </div>
        
        <div style="margin-bottom: 24px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text);">
            <i class="fas fa-sort-amount-down"></i> Ordenação
          </label>
          <select id="priceOrder" style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px;">
            <option value="mais-proximo">Mais próximo do valor → Mais caro</option>
            <option value="mais-barato">Mais barato → Mais caro</option>
            <option value="mais-caro">Mais caro → Mais barato</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="applyPriceFilter()" style="margin-top: 20px;">
        <i class="fas fa-check-circle"></i> Aplicar Filtro
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h2><i class="fas fa-shopping-cart"></i> Seu Carrinho</h2>
        <button class="close-cart" onclick="closeCart()"><i class="fas fa-times"></i></button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="order-total">
        <span>Total:</span>
        <span id="cartTotal">R$ 0,00</span>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top: 20px;" onclick="proceedToCheckout()">
        <i class="fas fa-check-circle"></i> Finalizar Compra
      </button>
    </div>
  </div>

  <script src="/js/header.js?v=1"></script>
  <script src="/js/main.js?v=6"></script>
  <script src="/js/busca.js?v=3"></script>
  <script>
    // Search function
    function searchProducts() {
      const query = document.getElementById('searchInput').value;
      if (query.trim()) {
        window.location.href = `/busca?q=${encodeURIComponent(query)}`;
      }
    }

    // Enter key to search
    document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchProducts();
      }
    });

    // Auto-search on page load if there's a query
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const searchQuery = document.getElementById('searchInput');
      if (urlParams.get('q')) {
        searchQuery.value = urlParams.get('q');
      }
    });

    // Mobile filter drawer toggle
    function toggleMobileFilters() {
      document.getElementById('filterDrawer').classList.toggle('active');
      document.getElementById('filterOverlay').classList.toggle('active');
      document.body.style.overflow = document.getElementById('filterDrawer').classList.contains('active') ? 'hidden' : '';
    }

    function mobileFreteChange() {
      const mobileCheck = document.getElementById('mobileFreteGratis');
      const desktopCheck = document.getElementById('freteGratis');
      if (mobileCheck && desktopCheck) {
        desktopCheck.checked = mobileCheck.checked;
      }
      selectCategory(currentFilters.categoria);
    }

    // Sync mobile frete gratis when desktop changes
    document.addEventListener('change', function(e) {
      if (e.target.id === 'freteGratis') {
        const mobileCheck = document.getElementById('mobileFreteGratis');
        if (mobileCheck) mobileCheck.checked = e.target.checked;
      }
    });
  </script>
<div class="xmas-lights"></div>
<div class="xmas-garland"></div>
<div class="xmas-snow" id="xmasSnow"></div>
<script>
(function(){
  const snow = document.getElementById('xmasSnow');
  if(!snow) return;
  const flakes = ['❄','❅','❆'];
  for(let i=0;i<40;i++){
    const f = document.createElement('div');
    f.className = 'xmas-snowflake';
    f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
    f.style.left = Math.random()*100 + 'vw';
    f.style.animationDuration = (8 + Math.random()*12) + 's, ' + (3 + Math.random()*4) + 's';
    f.style.animationDelay = Math.random()*10 + 's, ' + Math.random()*5 + 's';
    f.style.fontSize = (10 + Math.random()*10) + 'px';
    snow.appendChild(f);
  }
})();
</script>
